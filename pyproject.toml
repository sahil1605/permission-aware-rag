[project]
name = "permission-aware-rag"
version = "0.1.0"
description = "RAG retrieval that enforces OpenFGA permissions, with a benchmark of three filtering strategies on Milvus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openfga-sdk>=0.10",
    "pymilvus[milvus_lite]>=2.5",
    "numpy>=1.26",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "fastembed>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "matplotlib>=3.8", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
